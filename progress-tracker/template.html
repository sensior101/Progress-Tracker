<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3e9">
<title>Progress Tracker</title>
<style>

:root{color-scheme:light;--bg:#f6f3e9;--paper:#fffdf6;--ink:#20211f;--muted:#67675e;--lime:#d5f46b;--orange:#ff956b;--purple:#c5b8ef;--line:#deddd2;--shadow:#20211f}
:root[data-theme="dark"]{color-scheme:dark;--bg:#252622;--paper:#30312c;--ink:#f6f3e9;--muted:#bdbfb1;--line:#505248;--shadow:#11120f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Malgun Gothic",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #8061cf;outline-offset:5px}.wrap{max-width:1320px;margin:auto;padding:0 48px}.topbar{border-bottom:2px solid var(--ink)}.nav{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:900;letter-spacing:-.7px;line-height:1.05}.brand-icon{display:grid;place-items:center;width:36px;height:36px;border:2px solid #20211f;background:var(--lime);color:#20211f;font-size:25px;box-shadow:3px 3px 0 var(--shadow)}.nav-right{display:flex;align-items:center;gap:24px}.mono{font-family:"Courier New",monospace;font-size:11px;font-weight:700;letter-spacing:1.3px}.nav-button{width:38px;height:38px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--paper);font-size:20px;box-shadow:2px 2px 0 var(--shadow)}.hero{padding:40px 0 32px}h1{font-size:clamp(34px,4.3vw,62px);line-height:1.2;letter-spacing:-2.7px;margin:0 0 16px;font-weight:900;overflow-wrap:anywhere}.subtitle{margin:0;color:var(--muted);font-size:15px}.overview{display:grid;grid-template-columns:1.15fr 1fr 1fr;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);margin-bottom:29px}.overview>div{padding:24px 26px;min-width:0}.overview>div+div{border-left:2px solid var(--ink)}.progress-card{background:var(--lime);color:#20211f}.metric-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;gap:10px}.metric-title .mono{font-size:10px}.big-number{font-family:Arial,sans-serif;font-size:65px;line-height:1.15;font-weight:900;letter-spacing:-4px;margin:12px 0}.big-number small{font-size:28px;letter-spacing:-1px;margin-left:3px}.bar{height:12px;background:#20211f20;border:1.5px solid #20211f}.bar>span{display:block;height:100%;background:#20211f;transition:width .2s}.metric-foot{font-size:12px;margin-top:8px}.count-card{background:var(--paper)}.count-numbers{display:flex;gap:30px;margin:17px 0 10px}.count-numbers strong{display:block;font:900 43px/1.2 Arial,sans-serif;letter-spacing:-2px}.count-numbers span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.count-numbers>div+div{border-left:1px solid var(--line);padding-left:30px}.next-card{background:var(--paper);display:flex;flex-direction:column}.next-title{font-size:19px;line-height:1.45;letter-spacing:-.7px;margin:21px 0 8px;font-weight:800;overflow-wrap:anywhere}.next-phase{color:var(--muted);font-size:12px;margin-top:auto}.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:45px 0 22px}.board-title{display:flex;align-items:center;gap:12px}h2{font-size:22px;line-height:1.3;letter-spacing:-.8px;margin:0}.phase-count{border:1.5px solid var(--ink);padding:1px 8px;font:700 12px/1.6 "Courier New",monospace;background:var(--paper)}.filters{display:flex;border:2px solid var(--ink);background:var(--paper)}.filter{padding:7px 15px;border:0;background:transparent;font-size:12px;font-weight:700}.filter+.filter{border-left:1px solid var(--ink)}.filter[aria-pressed="true"]{background:var(--ink);color:var(--bg)}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:22px;align-items:start}.phase{border:2px solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--shadow);min-width:0}.phase-heading{padding:18px 20px;border-bottom:2px solid var(--ink);background:var(--phase-color);color:#20211f}.phase-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.phase-no{font:700 11px/1.5 "Courier New",monospace;letter-spacing:1px}.badge{font-size:10px;font-weight:800;padding:2px 8px;border:1.5px solid #20211f;background:#fffdf6;box-shadow:2px 2px 0 #20211f}.phase-toggle{width:100%;display:flex;justify-content:space-between;gap:15px;align-items:center;text-align:left;border:0;padding:0;background:transparent;color:inherit;font-weight:900;font-size:20px;letter-spacing:-.7px}.phase-toggle .chevron{font-size:21px;font-weight:400}.desc{font-size:12px;margin:8px 0 0;opacity:.8}.tasks{margin:0;list-style:none;padding:5px 18px}.task{display:flex;gap:12px;padding:18px 0;align-items:flex-start}.task+.task{border-top:1px solid var(--line)}.task input{appearance:none;-webkit-appearance:none;flex:0 0 20px;width:20px;height:20px;margin:2px 0 0;border:2px solid var(--ink);background:var(--paper);cursor:pointer;display:grid;place-content:center;border-radius:0}.task input:checked{background:var(--lime);border-color:#20211f}.task input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #20211f;border-bottom:2px solid #20211f;transform:translateY(-1px) rotate(-45deg)}.task label{flex:1;cursor:pointer;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.task.checked .task-text{text-decoration:line-through;color:var(--muted)}.note{display:block;color:var(--muted);font-size:11px;margin-top:5px}.phase-footer{display:flex;justify-content:space-between;gap:12px;padding:13px 19px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);align-items:center}.mini-bar{width:75px;height:5px;background:var(--line)}.mini-bar span{display:block;height:100%;background:var(--ink)}.empty{font-size:12px;color:var(--muted);padding:24px 0}.bottom-note{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 0 42px}.save-note{margin:0;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}.save-dot{height:6px;width:6px;border-radius:50%;background:var(--muted);flex-shrink:0}.reset{border:0;border-bottom:1px solid var(--muted);color:var(--muted);background:transparent;padding:2px 0;font-size:11px;white-space:nowrap}footer{border-top:2px solid var(--ink);padding:18px 0 24px;display:flex;gap:20px;justify-content:space-between;color:var(--muted)}footer .mono{font-size:10px;letter-spacing:.7px}.nav-button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow)}.nav-button:active{transform:translate(2px,2px);box-shadow:none}
@media(min-width:1000px){.phase:only-child{max-width:600px}}
@media(max-width:800px){.wrap{padding:0 24px}.overview{grid-template-columns:1fr 1fr}.overview .progress-card{grid-column:1/-1}.overview>.count-card{border-left:0;border-top:2px solid var(--ink)}.overview>.next-card{border-top:2px solid var(--ink)}.board{gap:20px}}
@media(max-width:520px){.wrap{padding:0 20px}.nav{min-height:72px}.hero{padding:30px 0 26px}h1{letter-spacing:-1.5px}.subtitle{font-size:13px}.overview{box-shadow:4px 4px 0 var(--shadow);grid-template-columns:1fr}.overview>div{padding:19px 16px}.overview>.next-card{border-left:0}.count-numbers{gap:40px}.count-numbers>div+div{padding-left:40px}.big-number{font-size:64px}.next-title{margin:15px 0 8px}.board-toolbar{align-items:flex-start;flex-direction:column;margin-top:34px;gap:16px}.filter{padding:8px 18px}.board{grid-template-columns:1fr}.bottom-note{align-items:flex-start}footer{flex-direction:column;gap:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

.calendar-section{margin:36px 0 0}.calendar-intro{margin:8px 0 18px;color:var(--muted);font-size:12px}.calendar-layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);background:var(--paper)}.calendar-main{min-width:0}.calendar-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px;border-bottom:2px solid var(--ink)}.calendar-nav h3{font-size:20px;margin:0;letter-spacing:-.7px}.calendar-actions{display:flex;gap:6px}.calendar-button{border:1.5px solid var(--ink);background:var(--paper);padding:5px 10px;font-size:12px;min-height:34px}.calendar-button:hover{background:var(--lime);color:#20211f}.weekdays,.calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays span{padding:9px 0;text-align:center;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}.day{position:relative;min-width:0;min-height:92px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:5px}.day:nth-child(7n){border-right:0}.day.blank{background:var(--bg)}.day[aria-pressed="true"]{background:var(--lime);color:#20211f;box-shadow:inset 0 0 0 2px #20211f}.day-number{font:700 13px/1.5 "Courier New",monospace}.day[aria-current="date"] .day-number{background:var(--ink);color:var(--paper);padding:0 5px}.day-preview{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10px}.day-count{font-size:10px;font-weight:700}.calendar-side{border-left:2px solid var(--ink);padding:20px;min-width:0}.calendar-side h3{margin:0 0 4px;font-size:17px}.date-caption{margin:0 0 18px;font-size:11px;color:var(--muted)}.schedule-form{display:grid;gap:8px}.schedule-form label{font-size:12px;font-weight:700}.schedule-form select,.schedule-form input{width:100%;min-width:0;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 8px;border-radius:0;font:inherit;font-size:12px}.schedule-submit{border:2px solid #20211f;background:var(--orange);color:#20211f;padding:9px;font-weight:800;font-size:12px;box-shadow:2px 2px 0 var(--shadow);margin:6px 2px 0 0}.schedule-submit:disabled{opacity:.5;cursor:not-allowed}.schedule-status{font-size:11px;min-height:18px;margin:8px 0;color:var(--muted)}.agenda{list-style:none;padding:0;margin:12px 0 0}.agenda-item{padding:12px 0;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:8px}.agenda-item input{margin:4px 0 0;accent-color:#627529;width:17px;height:17px;flex-shrink:0}.agenda-item label{font-size:12px;overflow-wrap:anywhere;flex:1}.agenda-item.done .agenda-text{text-decoration:line-through;color:var(--muted)}.agenda-item small{display:block;color:var(--muted);font-size:10px}.remove-date{border:0;background:transparent;color:var(--muted);font-size:11px;padding:0 2px;white-space:nowrap}.task-body{flex:1;min-width:0}.task-body label{display:block}.task-date{display:block;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:10px;padding:2px 7px;margin:9px 0 0;text-align:left}.task-date.scheduled{background:var(--lime);color:#20211f;border-color:#20211f}.task-date:hover{border-color:var(--ink)}select:focus-visible{outline:3px solid #8061cf;outline-offset:3px}
@media(max-width:800px){.calendar-layout{grid-template-columns:1fr}.calendar-side{border-left:0;border-top:2px solid var(--ink)}.day{min-height:80px}}
@media(max-width:520px){.calendar-nav{padding:12px}.calendar-nav h3{font-size:17px}.calendar-button{padding:4px 8px}.day{padding:6px 4px;min-height:68px}.day-preview{display:none}.day-count{font-size:9px}.calendar-side{padding:16px}}
</style>
</head>
<body>

<header class="topbar"><div class="wrap nav"><div class="brand"><span class="brand-icon" aria-hidden="true">↗</span><span>PROGRESS<br>TRACKER</span></div><div class="nav-right"><button class="nav-button" id="theme" aria-label="어두운 테마로 전환" title="테마 전환">◐</button></div></div></header>
<main class="wrap">
<div class="hero"><div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></div></div>
<div class="overview" aria-label="프로젝트 진행 현황">
<div class="progress-card"><div class="metric-title"><span>전체 진행률</span><span class="mono">PROGRESS ↗</span></div><div class="big-number"><span id="percent">0</span><small>%</small></div><div class="bar" id="progress" role="progressbar" aria-label="전체 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="overallBar"></span></div><div class="metric-foot" id="overallText"></div></div>
<div class="count-card"><div class="metric-title"><span>작업 현황</span><span class="mono">TASKS / ✓</span></div><div class="count-numbers"><div><strong id="doneCount">0</strong><span>완료한 작업</span></div><div><strong id="leftCount">0</strong><span>남은 작업</span></div></div><div class="metric-foot" id="phaseSummary"></div></div>
<div class="next-card"><div class="metric-title"><span>다음 할 일</span><span class="mono">UP NEXT →</span></div><div class="next-title" id="nextTask"></div><div class="next-phase" id="nextPhase"></div></div></div>
<section class="calendar-section" aria-labelledby="calendarTitle">
<h2 id="calendarTitle">업무 캘린더</h2><p class="calendar-intro">날짜를 선택하고 기존 업무를 등록하세요. 업무마다 날짜 하나를 지정할 수 있어요.</p>
<div class="calendar-layout"><div class="calendar-main"><div class="calendar-nav"><h3 id="calendarMonth" aria-live="polite"></h3><div class="calendar-actions"><button class="calendar-button" id="prevMonth" aria-label="이전 달">←</button><button class="calendar-button" id="today">오늘</button><button class="calendar-button" id="nextMonth" aria-label="다음 달">→</button></div></div><div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar-days" id="calendarDays" role="group" aria-label="날짜 선택"></div></div>
<div class="calendar-side"><h3 id="selectedDateTitle"></h3><p class="date-caption">등록된 업무의 체크 상태는 프로젝트 보드와 연결됩니다.</p>
<form class="schedule-form" id="scheduleForm"><label for="scheduleTask">등록할 업무</label><select id="scheduleTask" required></select><label for="scheduleDate">등록 날짜</label><input type="date" id="scheduleDate" required min="0001-01-01" max="9999-12-31"><button class="schedule-submit" id="scheduleSubmit" type="submit">선택한 날짜에 등록</button></form>
<p class="schedule-status" id="scheduleStatus" role="status"></p><ul class="agenda" id="agenda" aria-label="선택한 날짜의 업무"></ul></div></div></section>
<div class="board-toolbar"><div class="board-title"><h2>프로젝트 보드</h2><span class="phase-count" id="phaseCount"></span></div><div class="filters" role="group" aria-label="작업 상태 필터"><button class="filter" data-filter="all" aria-pressed="true">전체</button><button class="filter" data-filter="pending" aria-pressed="false">미완료</button><button class="filter" data-filter="done" aria-pressed="false">완료</button></div></div>
<div class="board" id="phases"></div><div class="bottom-note"><p class="save-note" role="status"><span class="save-dot" aria-hidden="true"></span><span id="saveText">체크 상태와 등록 날짜는 이 브라우저에 저장됩니다.</span></p><button class="reset" id="reset">체크 초기화 ↺</button></div>
<footer><span class="mono">SMALL STEPS. REAL PROGRESS.</span><span class="mono" id="updated"></span></footer></main>
<!-- DATA: 이 JSON 블록만 교체합니다. done은 기본값이며 브라우저 체크 상태가 우선합니다. -->
<script id="data" type="application/json">
{
  "project": "새 프로젝트",
  "subtitle": "진행 상황 체크리스트",
  "updated": "",
  "phases": []
}
</script>
<script>

(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var KEY = 'progress-tracker:' + data.project;
  function load(key) {
    try { var saved = JSON.parse(localStorage.getItem(key || KEY)); return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {}; } catch (e) { return {}; }
  }
  function save(state, key) {
    try { localStorage.setItem(key || KEY, JSON.stringify(state)); document.getElementById('saveText').textContent = '변경 사항을 이 브라우저에 저장했어요.'; }
    catch (e) { document.getElementById('saveText').textContent = '브라우저 저장을 사용할 수 없어 새로고침하면 변경 사항이 사라질 수 있어요.'; }
  }
  function isDone(task, state) { return Object.prototype.hasOwnProperty.call(state, task.id) ? !!state[task.id] : !!task.done; }
  var state = load(), collapsed = {}, filter = 'all';
  var DATE_KEY = KEY + ':dates';
  var dates = load(DATE_KEY);
  var taskEntries = [];
  data.phases.forEach(function(phase) { phase.tasks.forEach(function(task) { taskEntries.push({task:task, phase:phase}); }); });
  function dateKey(date) { return String(date.getFullYear()).padStart(4, '0') + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0'); }
  function parseDate(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
    var date = new Date(2000, 0, 1); date.setHours(12, 0, 0, 0); date.setFullYear(Number(value.slice(0,4)), Number(value.slice(5,7))-1, Number(value.slice(8,10)));
    return date.getFullYear() > 0 && dateKey(date) === value ? date : null;
  }
  function taskDate(task) {
    var value = Object.prototype.hasOwnProperty.call(dates, task.id) ? dates[task.id] : task.date;
    return parseDate(value) ? value : '';
  }
  var selectedDate = dateKey(new Date());
  var monthDate = parseDate(selectedDate); monthDate.setDate(1);
  function setDone(task, checked) { state[task.id] = checked; save(state); render(); }
  var colors = ['var(--purple)', 'var(--lime)', 'var(--orange)'];
  function el(tag, cls, value) { var node = document.createElement(tag); if (cls) node.className = cls; if (value !== undefined) node.textContent = value; return node; }
  document.title = data.project + ' · Progress Tracker';
  document.getElementById('title').textContent = data.project;
  document.getElementById('subtitle').textContent = data.subtitle || '';
  document.getElementById('updated').textContent = data.updated ? 'UPDATED / ' + data.updated : '';
  function render() {
    var focusId = document.activeElement && document.activeElement.id;
    var root = document.getElementById('phases'); root.replaceChildren();
    var total = 0, done = 0, completedPhases = 0, next = null;
    data.phases.forEach(function (phase, pi) {
      var pDone = phase.tasks.filter(function(t) { return isDone(t, state); }).length;
      var pTotal = phase.tasks.length;
      total += pTotal; done += pDone;
      if (pTotal && pDone === pTotal) completedPhases++;
      if (!next) { var task = phase.tasks.find(function(t) { return !isDone(t, state); }); if (task) next = { task:task, phase:phase }; }
      var sec = el('section', 'phase'); sec.style.setProperty('--phase-color', colors[pi % colors.length]);
      var heading = el('div', 'phase-heading');
      var meta = el('div', 'phase-meta'); meta.appendChild(el('span', 'phase-no', 'PHASE ' + String(pi + 1).padStart(2, '0')));
      meta.appendChild(el('span', 'badge', pTotal && pDone === pTotal ? '완료 ✓' : pDone ? '진행 중 ↗' : '시작 전'));
      heading.appendChild(meta);
      var h = el('h3'); h.style.margin = '0';
      var toggle = el('button', 'phase-toggle'); toggle.id = 'phase-toggle-' + pi;
      toggle.setAttribute('aria-expanded', String(!collapsed[pi])); toggle.setAttribute('aria-controls', 'phase-tasks-' + pi);
      toggle.appendChild(el('span', '', phase.title)); toggle.appendChild(el('span', 'chevron', collapsed[pi] ? '+' : '−'));
      toggle.onclick = function () { collapsed[pi] = !collapsed[pi]; render(); };
      h.appendChild(toggle); heading.appendChild(h);
      if (phase.description) heading.appendChild(el('p', 'desc', phase.description));
      sec.appendChild(heading);
      var ul = el('ul', 'tasks'); ul.id = 'phase-tasks-' + pi; ul.hidden = !!collapsed[pi];
      var visible = 0;
      phase.tasks.forEach(function (task) {
        var checked = isDone(task, state);
        if ((filter === 'done' && !checked) || (filter === 'pending' && checked)) return;
        visible++;
        var li = el('li', 'task' + (checked ? ' checked' : ''));
        var cb = el('input'); cb.type = 'checkbox'; cb.id = 't-' + task.id; cb.checked = checked;
        cb.onchange = function () { setDone(task, cb.checked); };
        var label = el('label'); label.htmlFor = cb.id; label.appendChild(el('span', 'task-text', task.text));
        if (task.note) label.appendChild(el('span', 'note', task.note));
        var body = el('div', 'task-body'); body.appendChild(label);
        var dateButton = el('button', 'task-date' + (taskDate(task) ? ' scheduled' : ''), taskDate(task) || '+ 날짜 등록');
        dateButton.id = 'task-date-' + task.id;
        dateButton.setAttribute('aria-label', task.text + ' 날짜 ' + (taskDate(task) || '등록'));
        dateButton.onclick = function() {
          document.getElementById('scheduleTask').value = task.id;
          selectedDate = taskDate(task) || selectedDate; monthDate = parseDate(selectedDate); monthDate.setDate(1);
          renderCalendar(); document.getElementById('scheduleDate').focus(); document.getElementById('calendarTitle').scrollIntoView({behavior:'auto', block:'start'});
        };
        body.appendChild(dateButton); li.appendChild(cb); li.appendChild(body); ul.appendChild(li);
      });
      if (!visible) ul.appendChild(el('li', 'empty', pTotal ? '이 조건에 맞는 작업이 없어요.' : '아직 등록된 작업이 없어요.'));
      sec.appendChild(ul);
      var foot = el('div', 'phase-footer'); foot.appendChild(el('span', '', pDone + ' / ' + pTotal + ' 완료'));
      var bar = el('div', 'mini-bar'); bar.setAttribute('aria-hidden', 'true'); var fill = el('span'); fill.style.width = (pTotal ? pDone / pTotal * 100 : 0) + '%'; bar.appendChild(fill); foot.appendChild(bar); sec.appendChild(foot); root.appendChild(sec);
    });
    if (!data.phases.length) root.appendChild(el('p', 'empty', '등록된 단계가 없어요. 프로젝트의 첫 단계를 추가해보세요.'));
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('percent').textContent = pct;
    document.getElementById('overallBar').style.width = pct + '%';
    document.getElementById('progress').setAttribute('aria-valuenow', String(pct));
    document.getElementById('overallText').textContent = done + ' / ' + total + '개 작업 완료';
    document.getElementById('doneCount').textContent = done;
    document.getElementById('leftCount').textContent = total - done;
    document.getElementById('phaseSummary').textContent = data.phases.length + '개 단계 중 ' + completedPhases + '개 완료';
    document.getElementById('phaseCount').textContent = String(data.phases.length).padStart(2, '0');
    document.getElementById('nextTask').textContent = next ? next.task.text : total ? '모든 작업을 완료했어요! 🎉' : '첫 번째 작업을 기다리는 중';
    document.getElementById('nextPhase').textContent = next ? next.phase.title : total ? '하나씩 쌓아온 결과예요. 수고했어요.' : '프로젝트 데이터를 채워 시작해보세요.';
    renderCalendar();
    if (focusId) { var target = document.getElementById(focusId); if (target) target.focus({preventScroll:true}); else if (focusId.indexOf('t-') === 0) document.querySelector('.filter[aria-pressed="true"]').focus({preventScroll:true}); }
  }
  var taskSelect = document.getElementById('scheduleTask');
  var placeholder = el('option', '', taskEntries.length ? '업무를 선택하세요' : '먼저 프로젝트에 업무를 추가하세요'); placeholder.value = ''; taskSelect.appendChild(placeholder);
  taskEntries.forEach(function(entry) { var option = el('option', '', entry.phase.title + ' · ' + entry.task.text); option.value = entry.task.id; taskSelect.appendChild(option); });
  taskSelect.disabled = !taskEntries.length; document.getElementById('scheduleSubmit').disabled = !taskEntries.length;
  function renderCalendar() {
    var year = monthDate.getFullYear(), month = monthDate.getMonth();
    document.getElementById('calendarMonth').textContent = year + '년 ' + (month + 1) + '월';
    document.getElementById('prevMonth').disabled = year === 1 && month === 0;
    document.getElementById('nextMonth').disabled = year === 9999 && month === 11;
    var root = document.getElementById('calendarDays'); root.replaceChildren();
    var start = new Date(monthDate); start.setDate(1);
    var last = new Date(monthDate); last.setMonth(month + 1, 0);
    var days = last.getDate(), offset = start.getDay(), slots = Math.ceil((offset + days) / 7) * 7;
    var byDate = Object.create(null);
    taskEntries.forEach(function(entry) { var key = taskDate(entry.task); if (key) { if (!byDate[key]) byDate[key] = []; byDate[key].push(entry); } });
    for (var i = 0; i < slots; i++) {
      var day = i - offset + 1;
      if (day < 1 || day > days) { var blank = el('div', 'day blank'); blank.setAttribute('aria-hidden','true'); root.appendChild(blank); continue; }
      var date = new Date(monthDate); date.setDate(day); var key = dateKey(date);
      var entries = byDate[key] || [];
      var button = el('button', 'day'); button.id = 'day-' + key; button.type = 'button';
      button.setAttribute('aria-pressed', String(key === selectedDate));
      button.setAttribute('aria-label', key + ', 업무 ' + entries.length + '개');
      if (key === dateKey(new Date())) button.setAttribute('aria-current','date');
      button.appendChild(el('span','day-number',day));
      if (entries.length) { button.appendChild(el('span','day-count', entries.length + '개 업무')); button.appendChild(el('span','day-preview',entries[0].task.text)); }
      button.onclick = (function(value) { return function() { selectedDate = value; document.getElementById('scheduleStatus').textContent = ''; renderCalendar(); document.getElementById('day-' + value).focus({preventScroll:true}); }; })(key);
      root.appendChild(button);
    }
    document.getElementById('scheduleDate').value = selectedDate;
    var selected = parseDate(selectedDate);
    document.getElementById('selectedDateTitle').textContent = selected.getFullYear() + '년 ' + (selected.getMonth()+1) + '월 ' + selected.getDate() + '일';
    var agenda = document.getElementById('agenda'); agenda.replaceChildren();
    var scheduled = byDate[selectedDate] || [];
    scheduled.forEach(function(entry) {
      var task = entry.task, checked = isDone(task,state);
      var item = el('li','agenda-item' + (checked ? ' done' : ''));
      var cb = el('input'); cb.type = 'checkbox'; cb.id = 'agenda-' + task.id; cb.checked = checked; cb.onchange = function() { setDone(task,cb.checked); };
      var label = el('label'); label.htmlFor = cb.id; label.appendChild(el('span','agenda-text',task.text)); label.appendChild(el('small','',entry.phase.title));
      var remove = el('button','remove-date','해제'); remove.type = 'button'; remove.id = 'remove-date-' + task.id; remove.setAttribute('aria-label',task.text + ' 날짜 해제');
      remove.onclick = function() { dates[task.id] = ''; save(dates,DATE_KEY); document.getElementById('scheduleStatus').textContent = '날짜 등록을 해제했어요. 업무는 보드에 유지됩니다.'; render(); document.getElementById('scheduleTask').focus(); };
      item.appendChild(cb); item.appendChild(label); item.appendChild(remove); agenda.appendChild(item);
    });
    if (!scheduled.length) agenda.appendChild(el('li','empty','이 날짜에 등록된 업무가 없어요.'));
  }
  function moveMonth(delta) { monthDate.setMonth(monthDate.getMonth() + delta); renderCalendar(); }
  document.getElementById('prevMonth').onclick = function() { moveMonth(-1); };
  document.getElementById('nextMonth').onclick = function() { moveMonth(1); };
  document.getElementById('today').onclick = function() { selectedDate = dateKey(new Date()); monthDate = parseDate(selectedDate); monthDate.setDate(1); renderCalendar(); };
  document.getElementById('scheduleForm').onsubmit = function(event) {
    event.preventDefault();
    var entry = taskEntries.find(function(entry) { return entry.task.id === taskSelect.value; });
    var value = document.getElementById('scheduleDate').value;
    if (!entry || !parseDate(value)) { document.getElementById('scheduleStatus').textContent = '업무와 올바른 날짜를 선택하세요.'; return; }
    dates[entry.task.id] = value; selectedDate = value; monthDate = parseDate(value); monthDate.setDate(1);
    save(dates,DATE_KEY); render(); document.getElementById('scheduleStatus').textContent = '선택한 업무를 ' + value + '에 등록했어요.';
  };
  document.querySelectorAll('.filter').forEach(function(button) {
    button.onclick = function() { filter = button.dataset.filter; document.querySelectorAll('.filter').forEach(function(b) { b.setAttribute('aria-pressed', String(b === button)); }); render(); };
  });
  document.getElementById('reset').onclick = function () {
    if (confirm('체크 상태만 파일의 기본값으로 되돌릴까요? 등록한 날짜는 유지됩니다.')) { state = {}; save(state); render(); }
  };
  document.getElementById('theme').onclick = function () {
    var dark = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    this.setAttribute('aria-label', dark ? '밝은 테마로 전환' : '어두운 테마로 전환');
  };
  render();
})();
</script>
